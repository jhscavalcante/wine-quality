# Referência local/manual. O container Docker usa [nginx.docker.conf.template](nginx.docker.conf.template)
# gerado em runtime por [start.sh](start.sh).
server {
    listen 8000;

    # Streamlit (Interface principal)
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # FastAPI (API: docs, predict, health, simulations, openapi)
    location ~ ^/(docs|redoc|openapi\.json|predict|health|simulations) {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
